name: 问题反馈
description: 反馈使用 Forbric 时遇到的问题。
body:
  - type: markdown
    attributes:
      value: |
        请在上方的标题栏填写「问题标题」，用一句话概括遇到的问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述实际发生的情况和你期望的结果，可补充截图及相关版本信息。
      placeholder: 使用 Forbric 时遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现
      description: 请按顺序列出触发问题的操作；如果无法稳定复现，请说明发生时的情况。
      placeholder: |
        1. 安装或启动……
        2. 执行……
        3. 出现……
    validations:
      required: true

  - type: upload
    id: logs
    attributes:
      label: 日志
      description: 请拖拽或点击上传日志文件（.log、.txt）或压缩包（.zip、.gz）；没有日志可留空。
    validations:
      required: false
      accept: ".log,.txt,.zip,.gz"
